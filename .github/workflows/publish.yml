# Renders today's frame and publishes it with GitHub Pages - the frame
# downloads it from there, so no server is needed.
#   https://<user>.github.io/avian-frame/            status page + preview
#   https://<user>.github.io/avian-frame/frame.bin   what the panel draws
# Settings live in repo variables (Settings -> Secrets and variables ->
# Actions -> Variables): BW_STATION_ID, STYLE, WAKE_TIMES, FRAME_TZ, TITLE, SUBTITLE.
name: publish

on:
  schedule:
    - cron: "23 9 * * *"   # daily, ~5 am Toronto (GitHub can start late; the frame wakes at 7)
    - cron: "41 * * * *"   # TEMPORARY: hourly, to test that SenseCraft re-fetches. Remove after testing.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      BW_STATION_ID: ${{ vars.BW_STATION_ID || '10393' }}
      STYLE: ${{ vars.STYLE || 'woodblock' }}
      WAKE_TIMES: ${{ vars.WAKE_TIMES || '07:00' }}
      TZ: ${{ vars.FRAME_TZ || 'America/Toronto' }}
      TITLE: ${{ vars.TITLE || '{date}' }}
      SUBTITLE: ${{ vars.SUBTITLE || 'Avian Visitors This Week' }}
      FRAME_REV: ${{ vars.FRAME_REV }}
      STAMP: ${{ vars.STAMP || '0' }}   # 'updated ...' label on the image; set var STAMP=1 to show
      AV_ROOT: /home/runner/AvianVisitors
      AV_FRAME_DIR: /home/runner/AvianVisitors/frame
      STYLES_DIR: ${{ github.workspace }}/server/styles
      DATA_DIR: /tmp/avian-publish
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upstream AvianVisitors + render deps
        run: |
          git clone --depth 1 --branch avian-visitors https://github.com/Twarner491/AvianVisitors.git $AV_ROOT
          chmod -R go-w $AV_ROOT   # upstream's bundle runtime refuses group/world-writable files
          pip install -r $AV_FRAME_DIR/requirements-shoot.txt numpy
          python -m playwright install --with-deps chromium
      - name: Render
        run: |
          python server/publish_frame.py --out site --fw firmware/release/version.txt
          for f in firmware.bin firmware-full.bin version.txt; do
            [ -f "firmware/release/$f" ] && cp "firmware/release/$f" site/
          done
          touch site/.nojekyll
          ls -la site
          cat site/meta.txt
      # One artifact name per attempt, so "Re-run" doesn't find two and fail.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Keep the daily schedule alive
        # GitHub pauses scheduled workflows after 60 days without repo activity;
        # re-enabling them each run resets that.
        if: always()
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/enable" || true
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
