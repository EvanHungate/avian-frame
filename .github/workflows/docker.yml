# Builds the render server image for amd64 + arm64 and publishes it to
# GitHub Container Registry as ghcr.io/<your-github-user>/avian-frame.
# Runs on every push to main, weekly (to pick up new upstream illustrations),
# and on demand from the Actions tab.
name: docker

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/docker.yml"]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avian-frame" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Smoke test against live BirdWeather data: run the freshly pushed image,
  # wait for a render, and attach the preview + status as a build artifact.
  live-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run container
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avian-frame:${GITHUB_SHA}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name af -p 8088:8088 -e TZ=America/Toronto \
            -e BW_STATION_ID=10393 "$IMG"
          for i in $(seq 1 60); do
            curl -sf -o frame.bin http://127.0.0.1:8088/frame.bin && break
            sleep 5
          done
          mkdir out
          docker logs af > out/container.log 2>&1
          curl -sf http://127.0.0.1:8088/status -o out/status.json
          curl -sf http://127.0.0.1:8088/preview.png -o out/preview.png
          curl -sf http://127.0.0.1:8088/frame.png -o out/frame.png
          cat out/status.json
          test "$(stat -c %s frame.bin)" = 192000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-preview
          path: out/
