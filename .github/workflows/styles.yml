# Renders the frame in every illustration style with live birds from the
# station, and (if a KIE_API_KEY or GEMINI_API_KEY repo secret exists) generates the custom
# styles first. Results are committed to previews/ and server/styles/.
# Run it from the Actions tab: "styles" -> "Run workflow".
name: styles

on:
  # Manual only, so editing this repo never spends image-generation credits.
  workflow_dispatch:
    inputs:
      generate:
        description: "Custom styles to generate (space-separated, e.g. ghibli linocut). Needs a KIE_API_KEY or GEMINI_API_KEY secret."
        default: "ghibli"
      limit:
        description: "How many of the station's top birds to generate (2 images each)"
        default: "5"

concurrency:
  group: styles
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BW_STATION_ID: "10393"
      TZ: America/Toronto
      AV_ROOT: /home/runner/AvianVisitors
      AV_FRAME_DIR: /home/runner/AvianVisitors/frame
      STYLES_DIR: ${{ github.workspace }}/server/styles
      DATA_DIR: /tmp/avian-preview
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      GENERATE: ${{ github.event.inputs.generate }}
      LIMIT: ${{ github.event.inputs.limit || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upstream AvianVisitors + render deps
        run: |
          git clone --depth 1 --branch avian-visitors https://github.com/Twarner491/AvianVisitors.git $AV_ROOT
          chmod -R go-w $AV_ROOT   # upstream's bundle runtime refuses group/world-writable files
          pip install -r $AV_FRAME_DIR/requirements-shoot.txt numpy
          python -m playwright install --with-deps chromium
      - name: Generate custom styles (kie.ai or Gemini)
        if: env.KIE_API_KEY != '' || env.GEMINI_API_KEY != ''
        run: |
          pip install -r $AV_ROOT/avian/scripts/requirements.txt
          for s in $GENERATE; do
            python server/stylegen.py --style "$s" --station "$BW_STATION_ID" --limit "$LIMIT" || echo "::warning::$s generation failed"
          done
      - name: No image-generation key
        if: env.KIE_API_KEY == '' && env.GEMINI_API_KEY == ''
        run: echo "::notice::No KIE_API_KEY or GEMINI_API_KEY secret - skipping generated styles (ghibli, linocut)"
      - name: Render previews
        run: python server/preview_styles.py --out previews woodblock impressionist audubon $GENERATE
      - name: Commit results
        run: |
          rm -rf server/.refs
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add previews server/styles
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Update style previews"
          git pull --rebase -X theirs
          git push
          # bot pushes don't trigger other workflows, so rebuild the image explicitly
          # (new generated styles get baked into it)
          if ! git diff --quiet HEAD~1 -- server/styles; then gh workflow run docker.yml; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: previews/
